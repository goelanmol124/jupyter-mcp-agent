[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-jupyter"
version = "0.1.0"
description = "MCP server for ipykernel Jupyter notebooks (.ipynb) with truthful run metadata"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "ipykernel>=6.29",
    "jupyter-client>=8.6",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
llm-jupyter = "llm_jupyter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "kernel: needs live ipykernel (slower)",
]
testpaths = ["tests"]

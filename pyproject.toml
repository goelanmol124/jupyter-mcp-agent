[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-jupyter"
version = "0.3.0"
description = "MCP server for ipykernel Jupyter notebooks (.ipynb) with truthful run metadata"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "jupyter", "notebook", "ipykernel", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.0",
    "ipykernel>=6.29",
    "jupyter-client>=8.6",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "watchfiles>=0.21"]
release = ["build>=1.2", "twine>=5.0"]

[project.scripts]
llm-jupyter = "llm_jupyter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "kernel: needs live ipykernel (slower)",
]
testpaths = ["tests"]

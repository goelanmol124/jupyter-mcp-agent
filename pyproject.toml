[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyter-mcp-agent"
version = "0.3.1"
description = "MCP server that lets AI coding agents run and edit Jupyter notebooks on a real ipykernel, with truthful run metadata"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "mcp-server", "jupyter", "notebook", "ipykernel", "llm", "ai-agent", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.0",
    "ipykernel>=6.29",
    "jupyter-client>=8.6",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/goelanmol124/jupyter-mcp-agent"
Issues = "https://github.com/goelanmol124/jupyter-mcp-agent/issues"
Changelog = "https://github.com/goelanmol124/jupyter-mcp-agent/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "watchfiles>=0.21"]
release = ["build>=1.2", "twine>=5.0"]

[project.scripts]
jupyter-mcp-agent = "jupyter_mcp_agent.cli:main"
# Backwards-compatible alias for the pre-0.3.1 name.
llm-jupyter = "jupyter_mcp_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "kernel: needs live ipykernel (slower)",
]
testpaths = ["tests"]
